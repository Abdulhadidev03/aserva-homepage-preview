eeting\u003c/h3>\u003cp>The widget takes on your brand, not ours.\u003c/p>\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"faq\" class=\"HomePage_faq__MGJaM\" aria-labelledby=\"faq-title\">\u003cdiv class=\"HomePage_shell__PKd0D HomePage_faqGrid__42FkL\">\u003ch2 id=\"faq-title\">Questions merchants ask us.\u003c/h2>\u003cdiv class=\"HomePage_faqList__zOYU9\">\u003cdetails>\u003csummary>Will Aserva change an order without my team?\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down\" aria-hidden=\"true\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/summary>\u003cp>Sensitive store changes are prepared for review. Your team checks the request and makes the decision before the change is carried out.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Where do Aserva's answers come from?\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down\" aria-hidden=\"true\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/summary>\u003cp>Aserva uses the product information, policies, and order context you connect to your store experience. Your team can review what information is available before customers rely on it.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can shoppers ask in Arabic and English?\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down\" aria-hidden=\"true\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/summary>\u003cp>Yes. Aserva suppor  d=\"M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z\">\u003c/path>\u003ccircle cx=\"13.5\" cy=\"6.5\" r=\".5\" fill=\"currentColor\">\u003c/circle>\u003ccircle cx=\"17.5\" cy=\"10.5\" r=\".5\" fill=\"currentColor\">\u003c/circle>\u003ccircle cx=\"6.5\" cy=\"12.5\" r=\".5\" fill=\"currentColor\">\u003c/circle>\u003ccircle cx=\"8.5\" cy=\"7.5\" r=\".5\" fill=\"currentColor\">\u003c/circle>\u003c/svg>\u003c/span>\u003cspan>\u003ch3>ألوانك وترحيبك\u003c/h3>\u003cp>تأخذ الأداة هوية متجرك، لا هويتنا.\u003c/p>\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"faq\" class=\"HomePage_faq__MGJaM\" aria-labelledby=\"faq-title\">\u003cdiv class=\"HomePage_shell__PKd0D HomePage_faqGrid__42FkL\">\u003ch2 id=\"faq-title\">أسئلة يطرحها التجار علينا.\u003c/h2>\u003cdiv class=\"HomePage_faqList__zOYU9\">\u003cdetails>\u003csummary>هل يغيّر Aserva الطلب دون الرجوع إلى فريقي؟\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down\" aria-hidden=\"true\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/summary>\u003cp>تُجهّز تغييرات المتجر الحساسة للمراجعة. يتحقق فريقك من الطلب ويتخذ القرار قبل تنفيذ التغيير.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>من أين تأتي إجابات Aserva؟\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down\" aria-hidden=\"true\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/summary>\u003cp>يستخدم Aserva معلومات المنتجات والسياسات وبيانات الطلبات التي تربطها بتجربة متجرك. ويمكن لفريقك مراجعة المعلومات المتاحة قبل اعتمادها في الردود.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>هل يستطيع العملاء السؤال بالعربية والإنجليزية؟\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down\" aria-hidden=\"true\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/summary>\u003cp>نعم. يدعم Aserva المحادثات بالعربية والإنجليزية، وتعتمد الردود على معلومات المتجر التي توفرها.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"HomePage_closing__7zzQ1\" aria-labelledby=\"closing-title\">\u003cdiv class=\"HomePage_closingCanvas__qNfIU\">\u003cdiv>\u003ch2 id=\"closing-title\">اكتشف ما يستطيع متجرك الإجابة عنه.\u003c/h2>\u003cp>افحص متجرك مجانًا لتعرف الأسئلة الجاهز لها، والثغرات التي تستحق المعالجة أولًا.\u003c/p>\u003cdiv class=\"HomePage_closingActions__Qow0d\">\u003ca class=\"HomePage_actionButton__6_Np7 HomePage_actionLarge__iRe_q HomePage_action_light__HLJGt\" href=\"https://aserva.io/scan?source=homepage\" target=\"_blank\" rel=\"noopener\">\u003cspan>افحص متجرك\u003c/span>\u003cspan class=\"HomePage_actionIcon__1gpyo\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up-right\" aria-hidden=\"true\">\u003cpath d=\"M7 7h10v10\">\u003c/path>\u003cpath d=\"M7 17 17 7\">\u003c/path>\u003c/svg>\u003c/span>\u003c/a>\u003ca class=\"HomePage_actionButton__6_Np7 HomePage_actionLarge__iRe_q HomePage_action_outline__lHf8e\" href=\"https://aserva.io/demo\" target=\"_blank\" rel=\"noopener\">\u003cspan>تحدث معنا\u003c/span>\u003cspan class=\"HomePage_actionIcon__1gpyo\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-line li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch2>قانوني\u003c/h2>\u003cul>\u003cli>\u003ca href=\"https://aserva.io/privacy\" target=\"_blank\" rel=\"noopener\">الخصوصية\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://aserva.io/terms\" target=\"_blank\" rel=\"noopener\">الشروط\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"HomePage_footerBottom__u3JmM\">\u003cspan>© \u003c!-- -->2026\u003c!-- --> Aserva. \u003c!-- -->جميع الحقوق محفوظة.\u003c/span>\u003ca href=\"#top\">العودة إلى الأعلى\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up-right\" aria-hidden=\"true\">\u003cpath d=\"M7 7h10v10\">\u003c/path>\u003cpath d=\"M7 17 17 7\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003c/footer>\u003c/div>","scenarios":[{"chat":"\u003cdiv class=\"HomePage_chatBody__wNdX9\" aria-live=\"off\" data-x=\"chat-body\" data-x=\"chat-body\">\u003cp class=\"HomePage_bubbleShopper__paWDH\">\u003cspan class=\"HomePage_visuallyHidden__u5gDM\">العميل\u003c!-- -->: \u003c/span>هل مقاس هذه البلوزة مضبوط؟\u003c/p>\u003cp class=\"HomePage_bubbleAssistant__N91up\">\u003cspan class=\"HomePage_visuallyHidden__u5gDM\">Aserva\u003c!-- -->: \u003c/span>قصّتها واسعة قليلًا، لذا يختار أغلب العملاء مقاسًا أصغر. المقاسان S وM متوفران.\u003c/p>\u003cdiv class=\"HomePage_chatItem__O_KQG\">\u003cspan class=\"HomePage_chatItemMedia__9OxWI\">\u003cimg alt=\"\" loading=\"lazy\" width=\"88\" height=\"88\" decoding=\"async\" data-nimg=\"1\" style=\"color:transparent\" src=\"assets/hero-product-pink-blouse-studio.jpg\">\u003c/span>\u003cspan class=\"HomePage_chatItemText____Fap\">\u003cstrong>بلوزة ملفوفة\u003c/strong>\u003csmall>المقاسان S وM متوفران\u003c/small>\u003c/span>\u003cem class=\"HomePage_chatItemStatus__Fq75K\" data-tone=\"product\">متوفر\u003c/em>\u003c/div>\u003c/div>","source rva.io/demo\" target=\"_blank\" rel=\"noopener\">\u003cspan>احجز عرضًا\u003c/span>\u003cspan class=\"HomePage_actionIcon__1gpyo\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up-right\" aria-hidden=\"true\">\u003cpath d=\"M7 7h10v10\">\u003c/path>\u003cpath d=\"M7 17 17 7\">\u003c/path>\u003c/svg>\u003c/span>\u003c/a>\u003c/div>\u003c/nav>","openInner":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-x\" aria-hidden=\"true\">\u003cpath d=\"M18 6 6 18\">\u003c/path>\u003cpath d=\"m6 6 12 12\">\u003c/path>\u003c/svg>","closedInner":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-menu\" aria-hidden=\"true\">\u003cpath d=\"M4 5h16\">\u003c/path>\u003cpath d=\"M4 12h16\">\u003c/path>\u003cpath d=\"M4 19h16\">\u003c/path>\u003c/svg>","openLabel":"إغلاق القائمة","closedLabel":"فتح القائمة"}}};

<script>
;(() => {
  const DATA = window.__PREVIEW__
  const NAV_ACTIVE = window.__NAV_ACTIVE__
  const SECTIONS = ["hero", "product", "team", "how-it-works", "widget", "faq"]
  const app = document.getElementById("app")
  let teardown = () => {}

  const fromHtml = (html) => {
    const template = document.createElement("template")
    template.innerHTML = html.trim()
    return template.content.firstElementChild
  }

  function render(locale, keepScroll) {
    const y = window.scrollY
    teardown()
    app.innerHTML = DATA[locale].dom
    document.documentElement.lang = locale
    document.documentElement.dir = locale === "ar" ? "rtl" : "ltr"
    if (keepScroll) window.scrollTo(0, y)
    teardown = wire(DATA[locale], locale)
  }

  function wire(data, locale) {
    const controller = new AbortController()
    const { signal } = controller
    const observers = []
    const root = app.querySelector("#top")
    const header = root.querySelector('[data-x="header"]')
    const headerBar = header.firstElementChild
    const menuButton = root.querySelector('[data-x="menu-button"]')
    let menuOpen = false

    // Header: part of the hero at the top, a floating bar once the page moves.
    const syncHeader = () => header.setAttribute("data-scrolled", window.scrollY > 12 || menuOpen ? "true" : "false")
    syncHeader()
    window.addEventListener("scroll", syncHeader, { passive: true, signal })

    // Active section pill in the desktop nav.
    const navLinks = [...root.querySelectorAll('[data-x="desktop-nav"] a')]
    const setActive = (id) => {
      for (const link of navLinks) {
        const on = Boolean(id) && link.getAttribute("href") === "#" + id
        link.classList.toggle(NAV_ACTIVE, on)
        if (on) link.setAttribute("aria-current", "location")
        else link.removeAttribute("aria-current")
      }
    }
    if ("IntersectionObserver" in window) {
      const sectionObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) if (entry.isIntersecting) setActive(entry.target.id === "hero" ? null : entry.target.id)
      }, { rootMargin: "-45% 0px -50% 0px" })
      for (const id of SECTIONS) {
        const section = document.getElementById(id)
        if (section) sectionObserver.observe(section)
      }
      observers.push(sectionObserver)
    }

    // Hero moments: the progress bar's animation ending advances the tour; hover or keyboard focus pauses it.
    const moments = root.querySelector('[data-x="moments"]')
    const buttons = [...moments.querySelectorAll("button")]
    let progress = moments.querySelector('[data-testid="moment-progress"]')
    const progressClass = progress.className
    let selected = 0
    let hovered = false
    let keyboardFocus = false
    let inView = true
    const syncPaused = () => moments.setAttribute("data-paused", hovered || keyboardFocus || !inView ? "true" : "false")
    const onProgressEnd = (event) => {
      if (event.target !== progress || event.pseudoElement) return
      select((selected + 1) % buttons.length, false)
    }
    progress.addEventListener("animationend", onProgressEnd)

    function select(index, announce) {
      selected = index
      buttons.forEach((button, i) => button.setAttribute("aria-pressed", String(i === index)))
      const body = root.querySelector('[data-x="chat-body"]')
      const next = fromHtml(data.scenarios[index].chat)
      next.setAttribute("aria-live", announce ? "polite" : "off")
      body.replaceWith(next)
      const glass = root.querySelector('[data-x="glass-source"]')
      const freshGlass = glass.cloneNode(false)
      freshGlass.innerHTML = data.scenarios[index].source
      glass.replaceWith(freshGlass)
      progress.remove()
      progress = document.createElement("span")
      progress.className = progressClass
      progress.setAttribute("aria-hidden", "true")
      progress.addEventListener("animationend", onProgressEnd)
      buttons[index].appendChild(progress)
    }

    buttons.forEach((button, index) => button.addEventListener("click", () => select(index, true), { signal }))
    for (const region of [root.querySelector('[data-x="showcase"]'), root.querySelector('[data-x="dock"]')]) {
      region.addEventListener("mouseenter", () => { hovered = true; syncPaused() }, { signal })
      region.addEventListener("mouseleave", () => { hovered = false; syncPaused() }, { signal })
      region.addEventListener("focusin", (event) => {
        let visible = false
        try { visible = event.target.matches(":focus-visible") } catch { visible = false }
        if (visible) { keyboardFocus = true; syncPaused() }
      }, { signal })
      region.addEventListener("focusout", (event) => {
        if (!region.contains(event.relatedTarget)) { keyboardFocus = false; syncPaused() }
      }, { signal })
    }
    if ("IntersectionObserver" in window) {
      const heroObserver = new IntersectionObserver(([entry]) => { inView = entry.isIntersecting; syncPaused() }, { threshold: 0.35 })
      heroObserver.observe(root.querySelector('[data-x="hero"]'))
      observers.push(heroObserver)
    }
    syncPaused()

    // Mobile menu.
    let mobileNav = null
    function setMenu(open) {
      closeList(false)
      menuOpen = open
      menuButton.setAttribute("aria-expanded", String(open))
      menuButton.setAttribute("aria-label", open ? data.mobile.openLabel : data.mobile.closedLabel)
      menuButton.innerHTML = open ? data.mobile.openInner : data.mobile.closedInner
      if (open) {
        mobileNav = fromHtml(data.mobile.nav)
        headerBar.appendChild(mobileNav)
        for (const link of mobileNav.querySelectorAll("a")) link.addEventListener("click", () => setMenu(false))
      } else if (mobileNav) {
        mobileNav.remove()
        mobileNav = null
      }
      syncHeader()
    }
    menuButton.addEventListener("click", () => setMenu(!menuOpen), { signal })

    // Language picker (English and Arabic, the two languages the homepage is written in).
    let openList = null
    function closeList(focusTrigger) {
      if (!openList) return
      const { trigger, list } = openList
      list.remove()
      trigger.setAttribute("aria-expanded", "false")
      trigger.removeAttribute("aria-controls")
      openList = null
      if (focusTrigger) trigger.focus()
    }
    function choose(next) {
      closeList(false)
      if (next !== locale) render(next, true)
    }
    function openListFor(trigger) {
      const list = fromHtml(data.listbox)
      list.id = trigger.id + "-list"
      list.setAttribute("aria-labelledby", trigger.id)
      const options = [...list.querySelectorAll('[role="option"]')]
      options.forEach((option) => { option.id = trigger.id + "-" + option.getAttribute("lang") })
      let active = Math.max(0, options.findIndex((option) => option.getAttribute("aria-selected") === "true"))
      const paint = () => {
        options.forEach((option, index) => {
          if (index === active) option.setAttribute("data-active", "true")
          else option.removeAttribute("data-active")
        })
        list.setAttribute("aria-activedescendant", options[active].id)
      }
      options.forEach((option, index) => {
        option.addEventListener("mouseenter", () => { active = index; paint() })
        option.addEventListener("click", () => choose(option.getAttribute("lang")))
      })
      list.addEventListener("keydown", (event) => {
        const last = options.length - 1
        if (event.key === "ArrowDown") { event.preventDefault(); active = active === last ? 0 : active + 1; paint() }
        else if (event.key === "ArrowUp") { event.preventDefault(); active = active === 0 ? last : active - 1; paint() }
        else if (event.key === "Home" || event.key === "End") { event.preventDefault(); active = event.key === "Home" ? 0 : last; paint() }
        else if (event.key === "Enter" || event.key === " ") { event.preventDefault(); choose(options[active].getAttribute("lang")) }
        else if (event.key === "Escape") { event.preventDefault(); closeList(true) }
        else if (event.key === "Tab") closeList(false)
      })
      trigger.parentElement.appendChild(list)
      trigger.setAttribute("aria-expanded", "true")
      trigger.setAttribute("aria-controls", list.id)
      openList = { trigger, list }
      paint()
      list.focus()
    }
    root.addEventListener("click", (event) => {
      const trigger = event.target.closest('button[aria-haspopup="listbox"]')
      if (!trigger) return
      if (openList && openList.trigger === trigger) closeList(false)
      else { closeList(false); openListFor(trigger) }
    }, { signal })
    root.addEventListener("keydown", (event) => {
      const trigger = event.target.closest && event.target.closest('button[aria-haspopup="listbox"]')
      if (trigger && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
        event.preventDefault()
        if (!openList) openListFor(trigger)
      }
    }, { signal })
    document.addEventListener("mousedown", (event) => {
      if (openList && !openList.trigger.parentElement.contains(event.target)) closeList(false)
    }, { signal })

    return () => {
      controller.abort()
      observers.forEach((observer) => observer.disconnect())
    }
  }

  render("en", false)
})()

</script>
</body>
</html>
